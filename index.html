<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>婚禮座位查詢</title>

<style>
body {
  font-family: "Microsoft JhengHei", Arial;
  text-align: center;
  margin: 0;
  padding: 50px;

  /* ⭐ 背景鋪滿 */
  background-image: url("images/bg.png");
  background-size: auto;
  background-repeat: repeat;
}

/* ⭐ 白色遮罩 */
body::before {
  content: "";
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(255,255,255,0.6);
  z-index:-1;
}

/* ⭐ LOGO */
.logo-top {
  width: 160px;
  margin-bottom: 20px;
}

/* 標題 */
h1 {
  color: #3a5f8a;
  font-size: 30px;
  margin-bottom: 10px;
}

h2 {
  color: #6b8fb3;
  font-weight: normal;
  margin-bottom: 30px;
}

/* 輸入 */
input {
  padding: 12px;
  width: 260px;
  font-size: 16px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

/* 結果 */
#result {
  margin-top: 40px;
  font-size: 22px;
}

/* 圖片 */
img.result-img {
  margin-top: 20px;
  width: 220px;
  border-radius: 15px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<img src="images/logo.png" class="logo-top">

<h1>因「偉」有你 「佳」才完整</h1>
<h2>婚禮座位查詢</h2>

<input id="name" placeholder="請輸入您的姓名">

<div id="result"></div>

<script>

// ===== 原始資料（含人數）=====
const rawData = [

  ["何佳穎","主"],["何建賢","主"],["何靜宜","主"],["廖金珠","主"],

  ["羅廖不","主"],["林明鍾","主"],

  ["羅偉綸",1],["羅德欽",1],["羅德欽",1],["羅德欽",1],["羅德欽",1],
  ["羅啓源",1],["羅丙丁",1],["羅丙丁",1],["羅羽成",1],["羅羽成",1],

  ["江聰雲",2],["江聰雲",2],["江文期",2],["江文期",2],["江文期",2],
  ["江長遠",2],["江長遠",2],["江長遠",2],["江叡涵",2],["李禮侑",2],

  ["陳匯中",3],["陳匯中",3],["黃佳松",3],["黃佳松",3],
  ["張春豊",3],["張春豊",3],["林鼎杰",3],["謝昌霖",3],["蔡宗洋",3],

  ["李奕璁",4],["林威德",4],["謝焌騰",4],["賴傳憲",4],
  ["李奕璁",4],["王俊叡",4],["謝焌騰",4],["賴傳憲",4],
  ["江家瑋",4],["江家瑋",4],

  ["蔡仲堯",5],["林建傑",5],["廖奕霖",5],["邱建霖",5],
  ["劉冠麟",5],["林冠文",5],["廖奕霖",5],["林建宏",5],
  ["劉冠麟",5],["賴品誠",5],

  ["林銘昭",6],["林家禾",6],["李翠蘭",6],["李翠嬌",6],
  ["蔡寧得",6],["徐坤麟",6],["李翠蘭",6],["李翠嬌",6],
  ["蔡寧得",6],["林銘昭",6],

  ["何佳錂",7],["張依晴",7],["劉宗昀",7],["劉宗桓",7],
  ["劉宗旻",7],["劉宗旻",7],["李映慈",7],["李映慈",7],
  ["吳姿妤",7],["張家瑜",7],

  ["潘冠妤",8],["潘冠妤",8],["郭宇珊",8],["黃品翰",8],
  ["陳均",8],["陳均",8],["鄭竣尹",8],["鄭竣尹",8],
  ["潘湯宸華",8],["潘湯秉泓",8],

  ["黃品儒",9],["黃佑德",9],["黃佑德",9],["顏瑞栩",9],

  ["曾子耀",11],["曾子耀",11],["林軒霆",11],["蔡耀竹",11],
  ["高銘譽",11],["高銘譽",11],["陳定榮",11],
  ["陳定榮",11],["薛聖翰",11],["曾子翔",11],

  ["李婷涵",12],["李婷涵",12],["楊鈞皓",12],["黃宥朋",12],
  ["李育蓉",12],["吳柔勳",12],["吳柔勳",12],
  ["周冠邑",12],["周冠邑",12]

];

// ===== 即時搜尋 =====
function search(){
  const input = document.getElementById("name").value.trim();
  const result = document.getElementById("result");

  if(!input){
    result.innerHTML = "";
    return;
  }

  const matches = rawData.filter(d => d[0].includes(input));

  if(matches.length > 0){

    const name = matches[0][0];
    const table = matches[0][1];
    const count = rawData.filter(d => d[0] === name).length;

    const tableText = table === "主" ? "主桌" : `第${table}桌`;

    result.innerHTML = `
      您的座位在 <b style="color:#3a5f8a;">${tableText}</b><br>
      共 ${count} 位<br>
      <img src="images/${table}.png" class="result-img"><br><br>
      <span style="color:#6b8fb3;">婚禮見！</span>
    `;
  }else{
    result.innerHTML = `<span style="color:red;">查無資料，請確認姓名是否正確</span>`;
  }
}

// ⭐ 不用按按鈕，打字就查
document.getElementById("name").addEventListener("input", search);

</script>

</body>
</html>

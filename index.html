<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>婚禮座位查詢</title>

<style>
body {
  font-family: "Microsoft JhengHei", Arial;
  text-align: center;
  margin: 0;
  padding: 50px;

  background-image: url("images/bg.png");
  background-size: auto;
  background-repeat: repeat;
}

body::before {
  content: "";
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(255,255,255,0.6);
  z-index:-1;
}

.logo-top {
  width: 160px;
  margin-bottom: 20px;
}

h1 {
  color: #3a5f8a;
  font-size: 30px;
}

h2 {
  color: #6b8fb3;
  font-weight: normal;
  margin-bottom: 30px;
}

input {
  padding: 12px;
  width: 260px;
  font-size: 16px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

button {
  padding: 12px 20px;
  margin-left: 10px;
  background: #7faee6;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

button:hover {
  background: #5f94d4;
}

#result {
  margin-top: 40px;
  font-size: 22px;
}

img.result-img {
  margin-top: 20px;
  width: 220px;
  border-radius: 15px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<img src="images/logo.png" class="logo-top">

<h1>因「偉」有你 「佳」才完整</h1>
<h2>婚禮座位查詢</h2>

<input id="name" placeholder="請輸入您的全名">
<button onclick="search()">查詢</button>

<div id="result"></div>

<script>

// ===== 原始資料 =====
const rawData = [

  ["羅廖不","主"],["林明鍾","主"],

  ["羅啓源",1],["羅啓源",1],["羅啓源",1],["羅丙丁",1],["羅丙丁",1],

  ["江聰雲",2],["江聰雲",2],["江文期",2],["江文期",2],["江文期",2],
  ["江長遠",2],["江長遠",2],["江長遠",2],["江叡涵",2],["李禮侑",2],

  ["林銘昭",3],["林家禾",3],["李翠蘭",3],["李翠嬌",3],
  ["蔡寧得",3],["徐坤麟",3],["李翠蘭",3],["李翠嬌",3],
  ["蔡寧得",3],["林銘昭",3],

  ["蔡仲堯",4],["林建傑",4],["林建宏",4],["邱建霖",4],
  ["賴品誠",4],["林冠文",4],["謝焌騰",4],["謝焌騰",4],
  ["李奕璁",4],["李奕璁",4],

  ["林威德",6],["王俊叡",6],["賴傳憲",6],["賴傳憲",6],
  ["江家瑋",6],["江家瑋",6],["羅羽成",6],["羅羽成",6],

  ["陳定榮",11],["薛聖翰",11],["曾子翔",11],

  ["李婷涵",12],["李婷涵",12],["楊鈞皓",12],["黃宥朋",12],
  ["蔡宗洋",12],["李育蓉",12],
  ["周冠邑",12],["潘湯宸華",12],["潘湯秉泓",12],

];

// ===== 精準查詢 =====
function search(){
  const name = document.getElementById("name").value.trim();
  const result = document.getElementById("result");

  const matches = rawData.filter(d => d[0] === name);

  if(matches.length > 0){
    const table = matches[0][1];
    const count = matches.length;

    const tableText = table === "主" ? "主桌" : `第${table}桌`;

    result.innerHTML = `
      您的座位在 <b style="color:#3a5f8a;">${tableText}</b><br>
      共 ${count} 位<br>
      <img src="images/${table}.png" class="result-img"><br><br>
      <span style="color:#6b8fb3;">婚禮見！</span>
    `;
  }else{
    result.innerHTML = `<span style="color:red;">查無資料，請確認姓名是否正確</span>`;
  }
}

// Enter 查詢
document.getElementById("name").addEventListener("keydown", e=>{
  if(e.key==="Enter") search();
});

</script>

</body>
</html>
